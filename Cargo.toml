[package]
name = "aurum-terminal"
description = "A Rust powered Windows terminal."
version = "1.0.0-alpha.1"
authors = ["whittte169"]
license-file = "LICENSE"
readme = "README.md"
repository = "https://github.com/whittte169/Aurum"
edition = "2024"

[dependencies]
eframe = "0.37.0"
gfxinfo = "0.1.2"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
sysinfo = "0.40.4"
tokio = { version = "1.54.1", features = ["full"] }
wmi = "0.18.4"
